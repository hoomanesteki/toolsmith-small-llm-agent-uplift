name: CI

# The build fails on any claim this repository makes that stops being true.
#
#   quality      formatting, linting, typing
#   test         the suite, on two OSes and two Python versions
#   gates        the five governance gates (see `toolsmith ci all`)
#   reproduce    the full pipeline end to end, from empty checkout to report
#
# Everything runs with no API keys. `--provider simulated` is the default, so
# CI costs nothing and a fork can run the identical build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check --output-format=github src tests
      - name: Type check
        run: uv run mypy

  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras

      # The suite is 7,756 tasks, each executed against its oracle before it is
      # accepted, and it is derived from a seed rather than committed. Building
      # it takes about four minutes, which the four matrix cells would otherwise
      # each pay. The key is the generator's own source, so a hit is only
      # possible when the output would have been identical anyway; change a
      # template and every cell rebuilds.
      #
      # Only the derived file is cached. Pointing this at data/tasks would let a
      # restore write over sample.jsonl and the sealed hash, which are committed
      # and are the two files the governance gates exist to check.
      - name: Cache the generated task suite
        uses: actions/cache@v4
        with:
          path: data/tasks/tasks.jsonl
          key: suite-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('src/toolsmith/tasks/**/*.py', 'src/toolsmith/worlds/**/*.py', 'tests/conftest.py') }}

      - name: Run tests
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  site:
    name: Report site renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.23"
      - name: Render
        run: quarto render docs
      - name: Assert no include resolved to nothing
        run: |
          # A missing {{< include >}} renders as a silent blank in Quarto, which
          # is the worst possible failure mode for a report.
          for page in docs/_site/index.html docs/_site/results.html docs/_site/findings.html docs/_site/failures.html; do
            if ! grep -q "<table" "$page"; then
              echo "::error::$page has no table: an include resolved to nothing."
              exit 1
            fi
          done
          # The two diagram pages fail differently: a mermaid block with a
          # syntax error renders as an empty box rather than an error, so the
          # page still looks finished.
          for page in docs/_site/method.html docs/_site/governance.html; do
            if ! grep -q 'class="mermaid' "$page"; then
              echo "::error::$page lost its diagram."
              exit 1
            fi
          done
          echo "Every page rendered with its generated content."

  gates:
    name: Governance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras

      # Without this the job was theatre. A checkout has no data/tasks.jsonl,
      # and `ci decontam` and `ci hidden-split` used to print PASS when the
      # dataset was absent, so the two strongest claims in the project went
      # green on every push without being checked once. Both now fail rather
      # than pass when they cannot verify, and the dataset is here for them to
      # verify against.
      - name: Generate the dataset the gates check
        run: uv run toolsmith tasks build

      - name: Environment report
        run: uv run toolsmith doctor
      - name: License firewall
        run: uv run toolsmith ci firewall
      - name: Model agnosticism
        run: uv run toolsmith ci model-agnostic
      - name: Decontamination
        run: uv run toolsmith ci decontam
      - name: Hidden split integrity
        run: uv run toolsmith ci hidden-split
      - name: Budget cap
        run: uv run toolsmith ci budget

  reproduce:
    name: Reproduce every published number
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras

      - name: Build the worlds
        run: uv run toolsmith world build --all

      - name: Generate tasks and oracle programs
        run: uv run toolsmith tasks build

      - name: Verify the hidden split still matches its sealed hash
        run: uv run toolsmith ci hidden-split

      - name: Run the evaluation matrix
        run: uv run toolsmith matrix run --provider simulated --n 180 --trials 3

      - name: Run the optimizer tracks
        run: uv run toolsmith optimize run all --n 120

      - name: Regenerate every published artifact
        run: uv run toolsmith report build

      - name: Assert the committed artifacts are byte-identical
        run: |
          # The claim this enforces: every number in the report is regenerable.
          # Two reproducibility bugs have already been caught here (measured
          # wall-clock leaking into results, and gzip stamping its own filename
          # into the header), so this is a real gate rather than a formality.
          if ! git diff --quiet -- eval/ docs/_generated/ docs/data/; then
            echo "::error::Committed artifacts drifted from a fresh run."
            echo "Run 'make all' locally and commit the result."
            git --no-pager diff --stat -- eval/ docs/_generated/ docs/data/
            exit 1
          fi
          echo "Committed artifacts match a fresh run exactly."

      - name: Verify the zero-key demo works on a fresh checkout
        run: uv run toolsmith demo --run

      - uses: actions/upload-artifact@v7
        with:
          name: eval-artifacts
          path: |
            eval/results/
            eval/costs.csv
          if-no-files-found: ignore
