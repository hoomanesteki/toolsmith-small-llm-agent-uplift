name: Report site

# Renders the Quarto site and publishes it to GitHub Pages.
#
# The site is built from the committed artifacts in eval/, so it never needs an
# API key and never differs from what the repository claims. If the artifacts
# and the code disagree, the `reproduce` job in ci.yml has already failed.
#
# Publishing is gated on Pages being switched on for the repository, which is a
# setting rather than a build step and cannot be done from here. The render is
# not gated: it runs on every push and fails loudly if the site stops building.
# That split is deliberate. A red badge that means "somebody has not clicked a
# checkbox" trains people to ignore red badges.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "eval/**"
      - "src/toolsmith/report/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Render
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.23"

      - name: Regenerate report data from results.jsonl
        run: uv run toolsmith report build

      - name: Render the site
        run: quarto render docs

      - name: Check every page kept its generated content
        run: |
          # A missing {{< include >}} renders as a silent blank, which is the
          # worst failure mode a report has: it still looks finished.
          for page in docs/_site/index.html docs/_site/results.html docs/_site/findings.html; do
            grep -q "<table" "$page" || { echo "::error::$page lost its tables"; exit 1; }
          done

      - name: Is Pages switched on for this repository
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The site rendered. Publishing is off because Pages is not enabled for this repository. Turn it on under Settings, Pages, Source: GitHub Actions, then re-run this workflow."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: docs/_site

      # Always keep the rendered site downloadable, so the report is reachable
      # from the run even when it has nowhere to publish to.
      - uses: actions/upload-artifact@v4
        with:
          name: report-site
          path: docs/_site
          retention-days: 14

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
