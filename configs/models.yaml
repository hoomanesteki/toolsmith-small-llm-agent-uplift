# =============================================================================
# configs/models.yaml  -  the file that makes ToolSmith model-agnostic
# =============================================================================
#
# Every model the system can reach is declared here and nowhere else. Swapping
# an executor from `groq-oss-20b` to `claude-opus-5` is an edit to a pipeline
# YAML, never a code change. `tests/test_model_agnostic.py` proves it by
# asserting that no model identifier appears in any .py file under src/.
#
# FIELD NOTES
#   verified_on          Date the price and model id were checked against the
#                        provider's live docs. A null means UNVERIFIED: the
#                        report flags the row and `toolsmith probe models`
#                        should be run before publishing anything using it.
#   retires_on           Known shutdown date. CI warns inside 30 days.
#   training_data_use    Read by the license firewall. `forbidden` models may
#                        never appear as `generator_model` on a training row.
#   family               The reviewer may never share a family with the
#                        executor. Enforced by Registry.assert_reviewer_independence.
#   sim.source           card | spec | interpolated. Priors for the offline
#                        simulator, never a ToolSmith measurement.
#
# PRICES ARE PER MILLION TOKENS, USD.
# =============================================================================

models:

  # ---------------------------------------------------------------------------
  # Groq  -  the primary live provider. Inference only: Groq offers no
  # fine-tuning, and its LoRA inference is enterprise-gated to a model that
  # retires 2026-08-16.
  # ---------------------------------------------------------------------------

  groq-oss-20b:
    provider: groq
    model_id: openai/gpt-oss-20b
    price_in_per_m: 0.075
    price_out_per_m: 0.30
    cache_read_discount: 0.50      # Groq prompt caching, automatic, gpt-oss only
    batch_discount: 0.50           # does NOT stack with caching
    cache_ttl_s: 7200
    supports: {tools: true, strict_json: true, reasoning: true, parallel_tools: false}
    tier: cheap
    family: openai-oss
    training_data_use: allowed     # Groq ToS 6.3(e): competing-use only, no output-training ban
    verified_on: 2026-07-26
    notes: "1,000 TPS. Strict schema support. The workhorse of the eval matrix."
    sim:
      source: spec
      tau2: 0.602
      tok_per_s: 938
      ttft_s: 0.77
      json_valid_rate: 0.985
      tool_select_acc: 0.881
      param_acc: 0.892
      injection_resist: 0.72
      abstain_skill: 0.55
      verbosity: 0.95

